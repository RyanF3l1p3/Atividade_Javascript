<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parte 3 - Exercício 10 (Contagem Crescente)</title>
</head>
<body>
    <h1>Laços de Repetição: Exercício 10 (Contagem Crescente)</h1>
    <p>O resultado da contagem de 1 a 10 foi impresso no **Console** do navegador (aperte F12 para ver).</p>
    
    <script>
        // 10. Contagem de 1 até 10 com while:
        
        // 1. Inicializa a variável de contagem em 1 (o ponto de partida).
        let contador = 1;
        
        console.log("--- Iniciando Contagem Crescente (1 a 10) ---");

        // 2. Laço de repetição WHILE: continua enquanto o contador for menor ou igual a 10.
        while (contador <= 10) {
            // Mostra o valor atual
            console.log(`Contando: ${contador}`);
            
            // 3. ATUALIZAÇÃO: Incrementa o contador (Passo essencial).
            contador++; // Equivalente a: contador = contador + 1;
        }
        
        console.log("Contagem finalizada!");
        
    </script>
</body>
</html>
