<body>
    <h1>Objetos: Exercício 13 (Criação)</h1>
    <p>As propriedades do objeto `carro` foram impressas separadamente no **Console** do navegador (aperte F12 para ver).</p>

    <script>
        // 13. Criação de Objeto:
        
        // 1. Crie o objeto 'carro' com suas propriedades (chave: valor)
        const carro = {
            marca: "Toyota",
            modelo: "Corolla",
            ano: 2022
        };

        console.log("--- Detalhes do Objeto Carro ---");
        
        // 2. Mostre cada propriedade separadamente no console
        // Usamos a notação de ponto (`.`) para acessar o valor de cada chave
        console.log(`Marca: ${carro.marca}`);
        console.log(`Modelo: ${carro.modelo}`);
        console.log(`Ano: ${carro.ano}`);
        
        console.log("--- Fim dos Detalhes ---");
        
    </script>
</body>
