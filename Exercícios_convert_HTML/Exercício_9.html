<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parte 3 - Exercício 9 (Tabuada com for)</title>
    <style>
        /* Apenas para estilizar a saída */
        #resultado {
            font-family: monospace;
            white-space: pre; /* Preserva as quebras de linha */
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>Laços de Repetição: Exercício 9 (Tabuada)</h1>
    <p>Clique em **Executar** ou **Atualizar a página** para solicitar o número.</p>
    <p>A tabuada será exibida abaixo:</p>
    <div id="resultado">Aguardando entrada...</div>

    <script>
        // 9. Tabuada com for:
        
        // 1. Pede o número ao usuário e converte para número inteiro.
        const entrada = prompt("Digite um número inteiro para ver a tabuada (de 1 a 10):");
        const numero = parseInt(entrada);
        
        const resultadoDiv = document.getElementById('resultado');
        let saida = ''; // Variável para armazenar todo o texto da tabuada

        // 2. Verifica a validade da entrada
        if (isNaN(numero) || entrada === null || entrada.trim() === "") {
            saida = "Entrada inválida. Por favor, digite um número inteiro.";
            resultadoDiv.style.color = 'red';

        } else {
            saida += `--- Tabuada do ${numero} ---\n`;
            console.log(`--- Tabuada do ${numero} ---`);

            // 3. Laço de repetição FOR de 1 a 10
            for (let i = 1; i <= 10; i++) {
                const resultado = numero * i;
                const linha = `${numero} x ${i} = ${resultado}`;
                
                // Adiciona a linha ao texto de saída
                saida += linha + '\n';
                
                // Também mostra no console
                console.log(linha);
            }
        }
        
        // 4. Exibe o resultado na div
        resultadoDiv.textContent = saida;
        
    </script>
</body>
</html>
