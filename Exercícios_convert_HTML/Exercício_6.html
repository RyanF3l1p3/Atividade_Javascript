<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parte 2 - Exercício 6 (Par ou Ímpar)</title>
    <style>
        /* Apenas para melhor visualização do resultado na página */
        #resultado {
            font-size: 1.5em;
            font-weight: bold;
            color: darkgreen;
        }
    </style>
</head>
<body>
    <h1>Estruturas Condicionais: Exercício 6</h1>
    <p>Clique em **Executar** ou **Atualizar a página** para que o `prompt` solicite o número.</p>
    <p>A classificação aparecerá abaixo:</p>
    <div id="resultado"></div>

    <script>
        // 6. Número Par ou Ímpar:
        
        // 1. Pede o número ao usuário e converte para um número inteiro.
        const entrada = prompt("Digite um número inteiro:");
        const numero = parseInt(entrada);

        // Seleciona o elemento onde o resultado será exibido
        const resultadoDiv = document.getElementById('resultado');

        // 2. Verifica se a entrada é um número válido.
        if (isNaN(numero) || entrada === null || entrada.trim() === "") {
            resultadoDiv.textContent = "Entrada inválida. Por favor, digite um número.";
            console.error("Entrada inválida.");

        } else {
            // 3. Usa o operador Módulo (%) para verificar.
            // Se o resto da divisão por 2 for 0, é par.
            if (numero % 2 === 0) {
                const mensagem = `O número ${numero} é PAR.`;
                resultadoDiv.textContent = mensagem;
                console.log(mensagem);
            } else {
                // Caso contrário, é ímpar.
                const mensagem = `O número ${numero} é ÍMPAR.`;
                resultadoDiv.textContent = mensagem;
                console.log(mensagem);
            }
        }
        
    </script>
</body>
</html>
