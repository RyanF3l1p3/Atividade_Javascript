<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Parte 1 - Exercício 1 (let)</title>
</head>
<body>
    <h1>Declaração de Variáveis: Exercício 1</h1>
    <p>O resultado foi impresso no **Console** do navegador (aperte F12 para ver).</p>

    <script>
        // 1. Declaração com let:
        
        // Crie a variável 'idade' e atribua o valor inicial.
        let idade = 10; // Altere para sua idade real!
        
        // Armazena a idade inicial antes de reatribuir.
        const idadeAtual = idade; 

        // Atribui um novo valor: a idade daqui a 5 anos.
        idade = idade + 5; 
        
        // Armazena a nova idade.
        const novaIdade = idade;
        
        // Mostra o resultado no console:
        console.log(`Minha idade hoje é ${idadeAtual} e daqui a 5 anos será ${novaIdade}`);
        
    </script>
</body>
</html>
