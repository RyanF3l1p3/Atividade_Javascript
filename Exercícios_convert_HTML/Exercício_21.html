<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 21 - Fila de Atendimento</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { display: flex; gap: 30px; }
        .bloco { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; background-color: white; border-radius: 5px; flex: 1; }
        h2 { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        input[type="text"], button { padding: 10px; margin: 5px 0; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #28a745; color: white; cursor: pointer; transition: background-color 0.3s; margin-right: 10px; }
        button#btn-atender { background-color: #dc3545; }
        button:hover { opacity: 0.8; }
        #output-fila, #output-historico {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #eee;
            background-color: #f9f9f9;
            white-space: pre-wrap;
            font-family: monospace;
            height: 300px;
            overflow-y: scroll;
        }
        .info-aguardando { color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Parte 6 – Controle de Fila de Atendimento (Exercício 21)</h1>

    <div class="bloco">
        <h2>Controle da Fila</h2>
        <input type="text" id="input-nome" placeholder="Nome da Pessoa">
        <button onclick="entrarNaFila()">Entrar na Fila</button>
        <button id="btn-atender" onclick="atenderPessoa()">Atender</button>
    </div>

    <div class="container">
        <div class="bloco">
            <h2>Fila de Espera (Aguardando: <span id="contador-fila">0</span>)</h2>
            <p>Lista de pessoas na fila com a hora de entrada:</p>
            <div id="output-fila" class="resultado"></div>
        </div>

        <div class="bloco">
            <h2>Histórico de Atendimento</h2>
            <div id="output-historico" class="resultado"></div>
        </div>
    </div>

    <script>
        // VETOR 1: Armazena apenas as pessoas na fila
        const filaDeEspera = [];

        // VETOR 2: Armazena o histórico completo de atendimentos
        const historicoDeAtendimento = [];

        // Objeto de formatação de data/hora
        const formataData = new Intl.DateTimeFormat('pt-BR', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });

        // Formatação apenas de hora (para o primeiro vetor)
        const formataHora = new Intl.DateTimeFormat('pt-BR', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });

        // 1. INSERIR NA FILA (push())
        function entrarNaFila() {
            const nomeInput = document.getElementById('input-nome');
            const nome = nomeInput.value.trim();

            if (nome === "") {
                alert("Por favor, digite o nome da pessoa.");
                return;
            }

            const horaEntradaTimestamp = Date.now();
            
            // Objeto que será inserido na fila
            const novoCliente = {
                nome: nome,
                entradaTimestamp: horaEntradaTimestamp,
                entradaFormatada: formataData.format(horaEntradaTimestamp)
            };

            // Insere no final da fila (FIFO)
            filaDeEspera.push(novoCliente);
            
            // Limpa o input
            nomeInput.value = '';

            exibirDados();
        }

        // 2. RETIRAR DA FILA (shift())
        function atenderPessoa() {
            if (filaDeEspera.length === 0) {
                alert("A fila está vazia. Ninguém para atender!");
                return;
            }

            // Remove a primeira pessoa da fila (FIFO)
            const pessoaAtendida = filaDeEspera.shift();
            
            const horaAtendimentoTimestamp = Date.now();
            
            // Calcula o tempo de espera (em milissegundos)
            const tempoEsperaMs = horaAtendimentoTimestamp - pessoaAtendida.entradaTimestamp;

            // Converte milissegundos para um formato legível (hh:mm:ss)
            const segundos = Math.floor(tempoEsperaMs / 1000);
            const minutos = Math.floor(segundos / 60);
            const horas = Math.floor(minutos / 60);
            const tempoFormatado = 
                `${String(horas).padStart(2, '0')}:` +
                `${String(minutos % 60).padStart(2, '0')}:` +
                `${String(segundos % 60).padStart(2, '0')}`;

            // Cria o objeto para o Histórico (VETOR 2)
            const registroHistorico = {
                nome: pessoaAtendida.nome,
                entradaCompleta: pessoaAtendida.entradaFormatada, // Data e hora de entrada
                atendimentoCompleto: formataData.format(horaAtendimentoTimestamp), // Data e hora de saída
                tempoTotal: tempoFormatado // Tempo total de espera
            };

            // Insere o registro no histórico
            historicoDeAtendimento.push(registroHistorico);

            exibirDados();
            
            // Mensagem de confirmação opcional
            alert(`Pessoa atendida: ${pessoaAtendida.nome}. Tempo de espera: ${tempoFormatado}`);
        }

        // 3. EXIBIR DADOS (Atualiza os dois blocos de saída)
        function exibirDados() {
            const outputFila = document.getElementById('output-fila');
            const outputHistorico = document.getElementById('output-historico');
            const contadorFila = document.getElementById('contador-fila');
            
            contadorFila.textContent = filaDeEspera.length;

            // Atualiza a Fila de Espera (VETOR 1)
            let filaHtml = 'Posição | Nome | Hora de Entrada\n-------\n';
            if (filaDeEspera.length === 0) {
                filaHtml = 'A fila está vazia.';
            } else {
                filaDeEspera.forEach((cliente, index) => {
                    // Formata a hora apenas (sem a data) para o primeiro vetor
                    const horaApenas = formataHora.format(cliente.entradaTimestamp);
                    filaHtml += `${String(index + 1).padStart(3, '0')} | ${cliente.nome} | ${horaApenas}\n`;
                });
            }
            outputFila.textContent = filaHtml;

            // Atualiza o Histórico (VETOR 2)
            let historicoHtml = '';
            if (historicoDeAtendimento.length === 0) {
                historicoHtml = 'Nenhum atendimento registrado ainda.';
            } else {
                historicoDeAtendimento.slice().reverse().forEach(registro => { // Inverte para mostrar o mais recente primeiro
                    historicoHtml += `
Nome: ${registro.nome}
Entrada: ${registro.entradaCompleta}
Atendimento: ${registro.atendimentoCompleto}
Tempo de Espera: ${registro.tempoTotal}
---------------------------------------
`;
                });
            }
            outputHistorico.textContent = historicoHtml;
        }

        // Exibe os dados iniciais (fila vazia)
        exibirDados();
    </script>

</body>
</html>
