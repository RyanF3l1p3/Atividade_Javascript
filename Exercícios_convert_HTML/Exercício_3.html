<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parte 1 - Exercício 3 (Concatenação)</title>
</head>
<body>
    <h1>Declaração de Variáveis: Exercício 3 (Concatenação)</h1>
    <p>O resultado foi impresso no **Console** do navegador (aperte F12 para ver).</p>

    <script>
        // 3. Concatenação de Strings:
        
        // 1. Crie as três variáveis com let
        let nome = "Patrick";
        let sobrenome = "Rocha";
        let anoNascimento = 2000;
        
        // 2. Concatene o nome completo
        // Usamos um espaço entre nome e sobrenome
        const nomeCompleto = `${nome} ${sobrenome}`;
        
        // 3. Crie a frase usando Template Strings (o jeito mais fácil e moderno)
        // Note o uso da crase (`) e o ${} para inserir variáveis
        const fraseCompleta = `Olá, meu nome é ${nomeCompleto} e eu nasci em ${anoNascimento}.`;
        
        // 4. Mostre a frase no console
        console.log(fraseCompleta);
        
        // Exemplo da frase resultante para visualização:
        // "Olá, meu nome é Maria Silva e eu nasci em 1995."
        
    </script>
</body>
</html>
